version: '3.8'

services:
  mage:
    image: mageai/mageai:latest
    container_name: mage_condimensa3
    command: mage start condimensa_project
    env_file:
      - .env
    environment:
      # Variables de entorno para conexiones
      - MAGE_DATA_DIR=/home/src/condimensa_project
      - USER_CODE_PATH=/home/src/condimensa_project

      # QuickBooks Supabase
      - QUICKBOOKS_HOST=${QUICKBOOKS_HOST}
      - QUICKBOOKS_PORT=${QUICKBOOKS_PORT:-6543}
      - QUICKBOOKS_DB=${QUICKBOOKS_DB:-postgres}
      - QUICKBOOKS_USER=${QUICKBOOKS_USER}

      # ODIN WS v2 (QuickBooks)
      - ODIN_BASE_URL=${ODIN_BASE_URL}
      - ODIN_PUBLIC_KEY=${ODIN_PUBLIC_KEY}
      - ODIN_PRIVATE_KEY=${ODIN_PRIVATE_KEY}

      # Kronos Supabase (se mantiene hasta migrar)
      - KRONOS_HOST=${KRONOS_HOST}
      - KRONOS_PORT=${KRONOS_PORT:-6543}
      - KRONOS_DB=${KRONOS_DB:-postgres}
      - KRONOS_USER=${KRONOS_USER}

    ports:
      - "6789:6789"
    volumes:
      - ./condimensa_project:/home/src/condimensa_project
    restart: unless-stopped

  # PostgreSQL local para Data Warehouse 
  postgres_local:
    image: postgres:15
    container_name: condimensa_dwh_av3
    env_file:
      - .env
    environment:
      - POSTGRES_USER=condimensa
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=condimensa_analytics
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_av3:/var/lib/postgresql/data
    restart: unless-stopped

  # pgAdmin para administrar PostgreSQL
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: condimensa_pgadmin_av3
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@condimensa.com
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-change_me}
      - PGADMIN_CONFIG_SERVER_MODE=False
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data_av3:/var/lib/pgadmin
    depends_on:
      - postgres_local
    restart: unless-stopped

  # Dashboard Streamlit
  dashboard:
    image: python:3.11-slim
    container_name: condimensa_dashboard_av3
    working_dir: /app
    command: bash -c "pip install -q streamlit pandas plotly psycopg2-binary && streamlit run app.py --server.port=8501 --server.address=0.0.0.0"
    env_file:
      - .env
    environment:
      - DB_HOST=postgres_local
      - DB_PORT=5432
      - DB_NAME=condimensa_analytics
      - DB_USER=condimensa
      - DB_PASSWORD=${DB_PASSWORD}
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app
    depends_on:
      - postgres_local
    restart: unless-stopped

volumes:
  postgres_data_av3:
  pgadmin_data_av3:
