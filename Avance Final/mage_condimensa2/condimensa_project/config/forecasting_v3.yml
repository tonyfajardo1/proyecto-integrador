project:
  name: quickbooks-production-forecast-mage

paths:
  raw_dir: data/forecasting_v3/raw
  catalog_file: unused_catalog.xlsx
  sales_file: unused_sales.xlsx
  production_file: unused_production.xlsx
  costs_file: Costos.xlsx
  interim_dir: data/forecasting_v3/interim
  processed_dir: data/forecasting_v3/processed
  input_dir: data/forecasting_v3/input
  models_dir: data/forecasting_v3/models
  reports_dir: data/forecasting_v3/reports

sheets:
  catalog: Hoja1
  sales: datos ventas 2023 - actualidad
  production: Hoja1
  costs: cost abr 25
  pp_categories: Categorias

dataset:
  inactive_months: 12
  forecast_horizon_months: 6
  include_unmatched_pt: false
  seasonal_top_3_month_share: 0.6
  seasonal_max_active_months_per_year: 4

exogenous:
  enabled: true
  calendar_file: variables_exogenas_calendario.csv
  product_file: variables_exogenas_producto.csv

model:
  test_months: 3
  validation_months: 3
  forecast_model: best_ml_temporal_cv
  selection_metric: wape
  temporal_cv:
    enabled: true
    folds: 3
    validation_months: 3
  walk_forward:
    enabled: true
    windows: 6
    step_months: 1
    test_months: 3
  learning_curves:
    enabled: true
    points: 8
    min_train_fraction: 0.20
  random_state: 42
  max_iter: 250
  learning_rate: 0.06
  min_rows_to_train: 24
  ridge_alpha: 1.0
  sgd_alpha: 0.0001
  sgd_max_iter: 3000
  prediction_cap_multiplier: 3.0
  random_forest:
    n_estimators: 180
    max_depth: 18
    min_samples_leaf: 3
    max_features: 1.0
    n_jobs: -1
  random_forest_conservative:
    n_estimators: 180
    max_depth: 14
    min_samples_leaf: 10
    max_features: 1.0
    n_jobs: -1
  extra_trees:
    n_estimators: 180
    max_depth: 18
    min_samples_leaf: 3
    max_features: 1.0
    n_jobs: -1
  hgb_tuning_candidates:
    - {learning_rate: 0.03, max_iter: 250, max_leaf_nodes: 15, min_samples_leaf: 20, l2_regularization: 0.05}
    - {learning_rate: 0.04, max_iter: 350, max_leaf_nodes: 31, min_samples_leaf: 20, l2_regularization: 0.05}
    - {learning_rate: 0.06, max_iter: 250, max_leaf_nodes: 31, min_samples_leaf: 20, l2_regularization: 0.05}
    - {learning_rate: 0.08, max_iter: 250, max_leaf_nodes: 31, min_samples_leaf: 30, l2_regularization: 0.10}
    - {learning_rate: 0.10, max_iter: 200, max_leaf_nodes: 15, min_samples_leaf: 30, l2_regularization: 0.20}
    - {learning_rate: 0.05, max_iter: 400, max_leaf_nodes: 63, min_samples_leaf: 20, l2_regularization: 0.05}
    - {learning_rate: 0.03, max_iter: 500, max_leaf_nodes: 31, min_samples_leaf: 10, l2_regularization: 0.00}

decision:
  automation_thresholds:
    max_segment_wape: 0.10
    max_segment_wape_std: 0.03
    min_folds_below_wape_threshold: 0.67
    min_confidence: media
    allow_seasonal_auto: false
  confidence_thresholds:
    alta_max_risk: 0.09
    media_max_risk: 0.16
    segment_std_weight: 1.0
    seasonal_penalty: 0.01
    priority_penalty: 0.01
  explainability:
    top_products: 20
    top_features_per_product: 5
